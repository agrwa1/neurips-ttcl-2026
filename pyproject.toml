[project]
name = "neurips-ttcl-2026"
version = "0.1.0"
description = "Bias-accumulation and flow-routing experiments for continual learning."
readme = "README.md"
license = "MIT"
requires-python = "==3.10.*"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pillow>=10,<12",
  "pyyaml>=6,<7",
  "timm==0.6.12",
  "torch==2.13.0",
  "torchvision==0.28.0",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
